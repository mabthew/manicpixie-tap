name: ManicPixieThrift
options:
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: 379TRF57VQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"          # the App Clip must carry the same version/build as the app
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  ManicPixieThrift:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - path: Sources/App
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - target: ManicPixieThriftClip      # produces the "Embed App Clips" build phase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manicpixiethrift.app
        PRODUCT_NAME: ManicPixieThrift
        PRODUCT_MODULE_NAME: ManicPixieThrift
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Manic Pixie Thrift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    entitlements:
      path: Sources/App/ManicPixieThrift.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:tap.manicpixiethrift.com
    scheme:
      testTargets:
        - ManicPixieThriftTests

  ManicPixieThriftClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - Sources/Shared
      - path: Sources/Clip
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manicpixiethrift.app.Clip
        PRODUCT_NAME: ManicPixieThriftClip
        PRODUCT_MODULE_NAME: ManicPixieThriftClip
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPCLIP $(inherited)
    info:
      path: Sources/Clip/Info.plist
      properties:
        CFBundleDisplayName: Manic Pixie Thrift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
    entitlements:
      path: Sources/Clip/ManicPixieThriftClip.entitlements
      properties:
        com.apple.developer.on-demand-install-capable: true
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)com.manicpixiethrift.app
        com.apple.developer.associated-domains:
          - appclips:tap.manicpixiethrift.com
    scheme:
      environmentVariables:
        - variable: _XCAppClipURL
          value: https://tap.manicpixiethrift.com/?src=fob
          isEnabled: true

  ManicPixieThriftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ManicPixieThrift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manicpixiethrift.app.Tests
